# TikTok Shop 站点定价参数
# 版本：2026-11-11b（一件代发模式；物流改按重量计费）
# 变更要点：
#   1. 跨境段物流从固定 10 元改为**按重量线性计费**（官方头程公式，见下）
#   2. 汇率改用 ERP 实时值（/item/exchangeRate/getList，2026-11-11 20:15）
#   3. TH 补入「电商增长服务费」8.03%（此前漏算，导致采购价上限虚高 4.4 元）
#   4. TH 价格带下限 2.0 → 5.0（$4 以下全成本口径结构性亏损）
# 改完必须跑：python3 scripts/pricing_calc.py --check && python3 scripts/pricing_calc.py --limits
#
# ⚠️ shop_nick / seller_id 是占位符，换成自己店铺的值后再用（不要提交回仓库）。
#    脚本优先读环境变量 TH_SHOP_NICK / TH_SELLER_ID（VN 同理），见 .env.example。
#    pricing_calc.py 只读费率与价格带，不读 shop_nick/seller_id。

# 当前策略（2026-11-11 用户确认）：**暂不开达人佣金**，只走货架场 → 只用 shelf 档
# creator 档保留在配置里，是为了将来开佣金时不用重新推公式；enabled:false 时不参与评分与上限计算
#   切换方式：把对应站点 schemes.creator.enabled 改 true，并同步下调 target_margin 到 0.15

# ── 全局成本参数（站点可覆盖同名键）──
defaults:
  cny_per_usd: 6.67111                # 2026-11-11 20:15 ERP /item/exchangeRate/getList（1 USD = 6.67111 CNY）

  # ── 订单级固定费（2026-11-12 新增，按单收，与售价无关 → 低客单杀伤最大）──
  # 这类费用不能进 markup 比例，必须加进到岸成本，否则低客单被系统性高估利润
  order_fixed_fee_cny: 0.0            # 站点覆盖；TH 0.21 / VN 0.78，见各站点段

  # ── 税费代扣（2026-11-12 新增）──
  tax_withhold: 0.0                   # 平台代扣的流转税/所得税，按售价比例；站点覆盖

  # 国内段（一件代发实况：单件快递，非批量均摊）
  domestic_shipping: 5.0              # 一个包裹付一次；同城/省内改 3.5，跨省改 6.0
  # 注：1688 真包邮货源此项置 0（供应商包邮到货代仓）→ 到岸成本直降 5 元，
  #     是同价位可承受采购价提高约 8 元的唯一零风险手段。见 selection.yaml supplier_gates.true_free_shipping
  domestic_shipping_same_province: 3.5
  domestic_shipping_cross_province: 6.0
  domestic_shipping_per_extra_unit: 0.5   # 同包裹多一件只加续重
  freight_forwarder_fee: 2.0          # 货代：拆包+验货+换新包装+打包+贴单（云仓标准价 ¥2）
  # 实测（2026-11-11 义乌某云仓挂牌）：基础换包装/仓储/逐单拆包检验为免费项，纸箱气泡袋另计
  # → 签货代前按实际报价回填本项，区间 0–3；不要因为"免费"就填 0，需书面报价确认
  freight_forwarder_fee_range: [0.0, 3.0]
  packaging_material: 0.6             # 耗材；硬物/易碎需小号纸箱，另加 0.5-2.0

  # ── 跨境段物流（平台物流费，藏进售价；2026-11-11 起按重量）──
  # 计费依据（TH，官方口径）：头程 THB = 1 + (取整10g(重量) - 10) / 10 × 1，重量向上取整到 10g
  # 折算（1 CNY = 5.0438 THB）：10g=0.20 / 100g=1.98 / 150g=2.97 / 250g=4.96 / 400g=7.93 元
  # → 本质是 ¥0.0198/g 的线性费率 + ¥0.2 起收
  # ⚠ 该公式出自 2022-09-28 版价卡（妙手 help_center article_6294 引用）；
  #   官方称以最新版物流价卡为准，若实际调价需同步改本项并重跑 --limits
  shipping_cny_per_gram: 0.019827     # ¥/g，= 1 THB/10g ÷ 5.0438
  shipping_min_cny: 0.20              # 起收（10g 内）
  shipping_per_extra_unit_cny: 1.0    # 同包裹每增一件：多一件就多一份重量，已由重量计费覆盖，此值仅作兜底
  volumetric_divisor: 6000            # 抛重(kg) = L×W×H(cm) ÷ 6000；与实重取大（假花/收纳筐这类泡货的关键）
  default_weight_g: 150               # 定价兜底值（不要依赖，选品必须核实真实重量）
                                      # ⚠️ 2026-11-12 实测：本字段在 pricing_calc.py 里根本没被引用；
                                      # 且 ttl-publish 另有一套默认 1kg/10x10x10，两者与 400g 定价上界互相打架。
                                      # 一律显式传 --weight/--dims，禁止用任何默认值发布（见 pitfalls 9.3）

  bundle_pieces: 2                    # ⛔ 仅定价模型备查，不得据此铺货：一件代发下 2 件套 = 收2件钱发1件
                                      # （2026-11-12 第二批实测纠正，详见 SKILL 4.4 / strategy 3.3）
                                      # $3.5 下限后单件即落带内，无需组合装抬客单价

# ── 泰国站 ──
TH:
  shop_nick: "YOUR_SHOP_TH"
  seller_id: ""
  lang: "th"
  currency: "THB"

  # 扣点结构（第一性原理：每一项都是售价的百分比）
  platform_commission: 0.08           # 家居类非 Mall 约 6.42-11.77%，取保守 8%
  transaction_fee: 0.0321             # 交易手续费 3.21%
  ecommerce_growth_fee: 0.0803        # 电商增长服务费 8.03%（非电子类，单件上限 199 THB）
  # ↑ 官方 seller university essay 6044226542520081：2026-05-06 起非电子品类 8.03%
  #   这是一笔独立于 commission 的费用，此前配置漏算。按当时口径（固定运费10元/净利25%）
  #   补它后上限从 13.5 降到 9.1 元 —— 说明这类 8% 级费用能直接决定一个品能不能做，别漏项。
  refund_reserve: 0.07                # 退款/退货损耗预留 7%

  # ── 2026-11-12 补齐（原配置漏项）──
  # 平台基础设施费：1.07 THB/单。每月前 20 天不满 100 单的商家次月可免 → 破零期（0 单）实际为 0
  # 所以这里按"已豁免"填 0，起量后（>100 单/月）改回 0.21
  order_fixed_fee_cny: 0.0            # 1.07 THB ÷ 5.0438 = 0.21；破零期豁免 → 0
  # 新商电商增长服务费减免：入驻后前 21 天、上限 3000 THB
  # ⚠ 本店入驻约 1 个月 → 已过减免期，设 false。若开新店，前 21 天置 true
  growth_fee_waived: false
  # 进口税：2026-01-01 起取消 1500 THB 免税，1 THB 起征；平台自 2026-01-21 起代收
  # 家居类综合税负 ≈ 关税 10% + VAT 7% ≈ 17.7%，**由买家在下单时支付，不进卖家收入**
  # 但会抬高买家实付价 → 压低你能挂的挂价上限（需求侧影响，不是成本项）
  buyer_tax_rate: 0.177               # 仅用于输出"买家实付"，供价格带判断；不进 fee_rate

  rate_to_local: 5.0438               # RMB → THB（ERP 实时汇率）

  # 价格带（USD）：**按客单价（订单总额）判定，不按单件价判定**
  # 2026-11-12 修正：下限 5.0 → 3.5。依据 FastMoss 实拉 TH 跨境家居 TOP300 样本（n=48）：
  #   价格中位 $3.37、81% 在 $5 以下 → 卡 $5 等于放弃八成货盘，这就是"只筛出 14 条候选"的根因
  # 下限 3.5 的算术依据：$3.5 时 150g 单件可承受采购 ¥3.8（12% 净利），低于此采购价基本无货
  # ⚠ 买家实付 = 挂价 ×1.177（进口税 10%+VAT 7%，2026-01 起）。比价要用买家实付口径
  price_band_usd:
    min: 3.5
    max: 8.0

  # 两档打法，系数 = 1/(1-佣金-交易费-增长服务费-退款预留-达人佣金-目标净利)
  # ⚠ 2026-11-11 用户确认：破零期（首批 150 款）接受 12% 净利冲量，起量后回调 25%
  #   12% 把可承受采购价从 ¥5.7 抬到 ¥10.0（$5/150g），是打开货源池的唯一杠杆
  #   回调方式：target_margin 改回 0.25，markup 改回 2.05
  schemes:
    shelf:                            # 货架场：纯搜索/商品卡出单，不开达人佣金（当前启用）
      enabled: true
      affiliate_commission: 0.0
      target_margin: 0.12
      markup: 1.62                    # 1/(1-0.08-0.0321-0.0803-0.07-0.12)
      revert_target_margin: 0.25      # 起量后回调值
      revert_markup: 2.05
    creator:                          # 达人场：开 20% 佣金，净利必须降到 15%（当前停用）
      enabled: false                  # 2026-11-11 决定：暂不开达人佣金，起量后再评估
      affiliate_commission: 0.20
      target_margin: 0.15
      markup: 2.58                    # 1/(1-0.08-0.0321-0.0803-0.07-0.20-0.15)

  note: "新店免电商增长服务费：5000 THB/30天（2026-05-03 后入驻为 3000 THB/21天），非旧版写的 1000THB。冲量期可把 ecommerce_growth_fee 置 0，markup 降到 1.79"

# ── 越南站 ──
VN:
  shop_nick: "YOUR_SHOP_VN"
  seller_id: ""
  lang: "vi"
  currency: "VND"

  platform_commission: 0.14           # 非 Mall 默认 14%
  # ⚠ 待核：有来源称 VN「家居生活」属最高佣金档，实际可达 18.1%（非 Mall）
  #   若为真，本项应改 0.181，markup 随之上升约 0.1。**去后台下载三级类目费率表核实后回填**
  transaction_fee: 0.06               # 交易手续费 6%（2026-05-09 起由 5% 上调）
  # 新店前 90 天免交易手续费，上限 3000 万 VND（≈¥8700）
  # ⚠ 本店入驻约 1 个月 → 仍在免期内，置 true。90 天后必须改回 false，否则整个 VN 定价失准
  transaction_fee_waived: true
  ecommerce_growth_fee: 0.0           # VN 无此项（未核实到官方增长服务费）
  refund_reserve: 0.07

  # ── 2026-11-12 补齐（原配置漏项）──
  # 订单处理费：3000 VND/单（2025-10-27 起，按"成功送达订单"固定收，退货不退）
  order_fixed_fee_cny: 0.78           # 3000 VND ÷ 3845.8
  # 代扣税：Decree 117/2025，2025-07 起平台代扣 1% VAT（个人/个体户另加 0.5% 个税）
  # 跨境卖家按 1% VAT 计提；若后续注册越南税号并通过验证，此费可免
  tax_withhold: 0.01
  # 买家侧：单件 <100 万 VND 无关税，但 2025-02-18 起小包也要缴 VAT（10%）
  buyer_tax_rate: 0.10                # 仅用于输出"买家实付"，不进 fee_rate

  rate_to_local: 3845.8               # RMB → VND（ERP 实时汇率）

  # ⚠ VN 跨境头程费率**未核实**，暂沿用 TH 的单位费率。若 VN 价卡不同，需改本项
  shipping_cny_per_gram: 0.019827
  shipping_min_cny: 0.20

  # 价格带：TikTok VN 客单价均值 ≈$8.5（Shopee VN ≈$12），取 8.5 为上限
  # 下限同样从 1.0 抬到 5.0：VN 扣点更重（20% vs TH 19.24%），低客单更没空间
  # 2026-11-12：下限 5.0 → 3.5（同 TH 理由）。VN 实拉 n=37，价格中位 $3.85、78% 在 $5 以下
  # $3.5 时 150g 单件可承受采购 ¥4.1（12% 净利 + 免交易费窗口）
  price_band_usd:
    min: 3.5
    max: 8.5

  schemes:
    shelf:                            # （当前启用）
      enabled: true
      affiliate_commission: 0.0
      # 2026-11-12：破零期与 TH 对齐，净利 25% → 12%（冲量换价格优势）
      # 25% 时 markup 1.887 → $3.5 价位只承受 ¥1.8 采购（等于没货可做）
      # 12% 时 markup 1.515 → $3.5 可承受 ¥4.8、$5.0 可承受 ¥7.1 → 货源池打开
      target_margin: 0.12
      markup: 1.515                   # 1/(1-0.14-0-0.07-0.01-0.12)；免交易手续费期（22.00% 扣点）
      # ⚠ 免交易手续费期一结束（入驻后 90 天，**以店铺后台为准**）：
      #   交易费 6% 恢复 → 扣点 28.00% → markup 必须改成 1.75（仍按 12% 净利），
      #   若同时回调 25% 净利则改 2.128。到期前 7 天必须改，否则每单少算 6%
      revert_target_margin: 0.25
      revert_markup: 2.128
      markup_after_waiver_12pct: 1.75
      waiver_expires: "TBD_入驻日+90天" # 必须回填真实日期
    creator:                          # （当前停用）
      enabled: false
      affiliate_commission: 0.20
      target_margin: 0.15
      markup: 2.326                   # 1/(1-0.14-0-0.07-0.01-0.20-0.15)；免交易手续费期
      revert_markup: 2.63             # 免交易费期结束后

  note: "前90天免交易手续费期间把 transaction_fee 置 0，系数降到 1.85/2.27；VN 扣点比 TH 重 0.8 个点"

# ── 售价公式（唯一口径，勿自创）──
# 到岸成本(CNY) = 采购价×件数 + 国内运费 + 货代操作费 + 包材 + 物流藏价
#   物流藏价 = max(实重, 抛重) × shipping_cny_per_gram × 件数
#              抛重(g) = 长×宽×高(cm) ÷ volumetric_divisor × 1000
# 售价(本币)   = 到岸成本 × rate_to_local × markup
# 校验：**客单价（订单总额）** 落在 price_band_usd 区间内，否则该品在该站不成立（换品，不要硬调 markup）
#   旧版写"单件折美元 ≥ min"是 bug：2 件套客单 $7.02 完全在带内，单件等效 $3.51 却被判超带 → 组合装永远被拒。
#   已在 pricing_calc.py 修正为按客单价判定，`single_unit_ok` 只作提示。
# 泰国进口税（2026-01-01 起 1 THB 起征，关税 10%+VAT 7% ≈ 17.7%，平台 2026-01-21 起代收）：
#   由买家在下单时支付，**不进卖家收入、不进 fee_rate**，但会抬高买家实付价 → 压挂价上限。
#   pricing_calc 已输出 buyer_paid_usd 供比价；TH 挂 $5 → 买家实付 $5.89。
# 买家侧税：TH 17.7% / VN 10%（<100万 VND 无关税，但 2025-02-18 起小包缴 VAT）
