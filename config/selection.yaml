# TikTok Shop 铺货选品参数（TH/VN 家居类目）
# 版本：2026-11-11（一件代发模式重构）
# 基线：TikTok Shop 官方新商方法论 + 东南亚家居实测 + 1688/妙手官方费率口径
# 与本文件强耦合的：config/pricing.yaml（成本与加价系数）、scripts/pricing_calc.py（价格带校验）
# 改完必须跑：python3 scripts/pricing_calc.py --check

# ── 破零目标（官方口径，勿下调）──
target_skus: 150            # 官方：绝大部分商家上传150款后出首单
break_zero_days: 20         # 官方：上品到出单黄金期20天
min_stock: 5                # 平台侧"商品可售库存"下限（缺货是平台大忌）

# ── 履约红线（一件代发第一权重，不满足即剔除）──
# 官方口径（2026 东南亚跨境飞轮计划）：下单后48h 打包完成并更新"待发货-等待揽收"；
# 下单后3个自然日 完成到仓扫描。注意是3个自然日，不是网上流传的96小时。
fulfillment:
  dts_pack_hours: 48
  dts_warehouse_days: 3
  buffer_days: 1                      # 链路总耗时必须 ≤ 3-1=2 天，留1天给周末/爆仓
  # 判据不是"同省"，而是「发货地 → 货代仓 的国内快递时效」（2026-11-11 按 ERP 货代页实况修正）
  # 货代明确支持"国内快递也可发"，所以货源不必与货代同城同省，只看快递要几天
  max_transit_days: 1                 # 绿档：≤1 天（同城/省内/邻省次日达），D2 到仓送仓，有余量
  transit_soft_days: 2                # 黄档：2 天。需 24h 发货 + 次日达 + 书面确认，无任何缓冲，周末/爆仓即超
  transit_red_days: 3                 # 红档：≥3 天必超时，直接换发货地或剔除
  hard_deadline: 3                    # 链路总耗时上限 = 3 自然日（含周末），见 strategy 2.2
  seller_ships_48h_proof: required    # 1688 承诺 48h 发货，需客服书面确认（页面标注不算）
  forwarder_same_day_delivery: required  # 货代当天送仓（16:00 前到仓当日送，之后顺延次日）

# ── 地域收敛（选品先行、货代做约束）──
# 2026-11-11 实测 ERP 跨境版「货代管理」：筛选器是**城市级**，不是省级。
# 可选位置：全部 / 东莞市 / 义乌市 / 广州市 / 泉州市 / 海外 / 金华市
# 所以收敛粒度是城市，且这 5 个城市是"货代的物理位置"，不是"货源的限制范围"。
region:
  granularity: city
  clustering_source: ship_city          # 候选按 1688 实际发货地城市聚簇（省太粗，会放过 2 天时效差）
  forwarder_check: manual               # ERP「货代管理」人工核对（erp_client.py 无货代接口）
  erp_platform_filter: TIKTOK           # 服务平台必筛 TIKTOK 标签（还有 SHOPEE / SHOPEES，部分货代只做 Shopee）
  erp_cities_available: [东莞市, 义乌市, 广州市, 泉州市, 金华市]   # 实测列表；海外=本土店，不适用
  max_cities_active: 2                  # 同时运营的货代城市上限，超了拆包错发率线性上升
  no_forwarder_action: relocate_supplier # 时效不达标 → 先找同款其他发货地（同款多发货地极常见），找不到才剔除
  gate_field: ship_transit_days         # 候选清单字段：发货地到已选货代仓的国内快递天数
  gate_field_2: forwarder_city          # 候选清单字段：走哪家/哪个城市的货代仓

# 家居产业带 → 货代城市 映射（先验参考，一律以 1688 实际发货地 + 快递时效核实）
# 判读方式：看候选的发货城市，套下面的"最近货代城市"，再算快递天数决定绿/黄/红
industry_belt:
  义乌市:   [义乌市, 东阳市, 浦江市, 诸暨市, 金华市]        # 家居百货/收纳/厨房小工具，SKU 密度最高
  金华市:   [永康市, 武义县, 磐安县, 兰溪市, 金华市]        # 永康五金挂钩/置物架/锅具、浦江水晶
  东莞市:   [东莞市, 深圳市, 惠州市, 中山市, 佛山市]        # 硅胶制品/五金小配件/家居塑料/电子
  广州市:   [广州市, 佛山市, 揭阳市, 汕头市, 潮州市]        # 日用百货/布艺/皮具；潮州陶瓷走易碎红线直接剔
  泉州市:   [泉州市, 厦门市, 福州市, 南安市]                # 日用百货/南安水暖卫浴

# 无货代 tab 但家居强势的产地（必须靠"快递到最近货代城市"判绿黄红，不能直接剔）
#   台州市（塑料收纳/垃圾桶/黄岩日用品）→ 最近 义乌市/金华市，省内次日达 → 通常绿档
#   扬州市杭集（牙刷/洗漱）→ 最近 义乌市，约 1-2 天 → 需实测
#   临沂市（清洁用品）→ 最近 义乌市，约 2 天 → 黄档，仅高毛利款考虑

# ── 站点差异 ──
# ⚠ 2026-11-11b 全部重算：物流从"固定 10 元"改为"按重量 ¥0.0198/g"，
#   同时补入 TH 电商增长服务费 8.03%、汇率改用 ERP 实时值 → 采购价上限整体下移
#   数据来源：python3 scripts/pricing_calc.py --limits（本文所有上下限均由此反推，勿手填）
TH:
  currency: "THB"
  # 2026-11-12 修正：下限 5.0 → 3.5。实测 TH 跨境家居 TOP300（n=48）价格中位 $3.37、81% <$5
  # 卡 $5 等于放弃八成货盘 —— 这是"只筛出 14 条候选"的直接原因。
  # 判定口径按**客单价（订单总额）**，不按单件价（旧口径让 2 件套永远判超带）
  price_band_usd: [3.5, 8.0]
  # cost_floor/ceil 是**运营窗口**，不是数学边界。数学边界用 `pricing_calc.py --limits` 现算：
  #   shelf(1.62/12%净利) 150g：$8 上限 22.4、$3.5 下限 3.8
  #   shelf(1.62/12%净利) 400g：$8 上限 17.4、$3.5 下限 0.9
  # ⚠ 严禁把上限当固定常数：净利率一变（12%↔25%），上限差一倍
  cost_floor_cny: 3.5                 # 运营下限（$3.5 价位下 12% 净利能承受的采购价）
  cost_ceil_cny: 15.5                 # 运营上限（超此值挂价接近带上沿，转化率断崖）
  # ⚠ 买家实付 = 挂价 ×1.177（2026-01 起进口税）。比价与选价一律用买家实付口径，
  #   否则会高估自己的价格竞争力（挂 $5 的品，买家实际付 $5.89）
  bundle_unit_cost_ceil_cny: 9.4      # 2件套单件等效数学上限（150g/$8）；运营建议 ≤6
  chargeable_weight_max_g: 400        # 计费重量上限（按重量计费后从 150g 放宽；400g/$8 上限 17.4）
  chargeable_weight_max_g_bundle: 250 # 2件套：400g 时上限只剩 4.5，组合装别超 250g
  size_vol_gate: true                 # 尺寸门槛按**抛重**判：抛重(g)=L×W×H/6000×1000
  size_max_cm: [20, 15, 8]            # 抛重 400g 对应体积 ≤2400cm³；旧值 25×20×10=5000cm³ 会算出 833g
  note: "TH 家居主流价格带 $5-8；佛教文化，图案避开宗教元素。假花/收纳筐这类泡货必须按抛重算，实重轻不代表运费低"


VN:
  currency: "VND"
  # 2026-11-12 修正：下限 5.0 → 3.5。实测 VN 跨境家居 TOP300（n=37）价格中位 $3.85、78% <$5
  # 且 7 日销中位 3223 > TH 2364、达人出单率中位 67.8% < TH 75.5% → 货架场空间更大
  price_band_usd: [3.5, 8.5]
  # 破零期净利 25%→12%（与 TH 对齐）。25% 时 $3.5 只承受 ¥1.8 采购（等于没货可做）；
  # 12% + 免交易费窗口 → $3.5 承受 ¥4.1、$5.0 承受 ¥7.1
  cost_floor_cny: 3.5
  cost_ceil_cny: 21.0                 # $8.5/150g/12% 免交易费期实算 21.1；交易费恢复后降到 17.5
  bundle_unit_cost_ceil_cny: 7.6      # VN 2件套单件等效（$8.5/150g×2，12% 净利免交易费）
  chargeable_weight_max_g: 400
  chargeable_weight_max_g_bundle: 250
  size_vol_gate: true
  size_max_cm: [20, 15, 8]
  note: "前90天免交易手续费（上限3000万VND≈8700元），期间可冲量；VN 扣点 27% 比 TH 26.24% 只高 0.76pt，价格带是主差异"

# ── 四维评分权重（合计=1.0）──
# 需求规模不再打分，降为过滤条件（见 demand_filter）：一件代发下需求再高，发不出去也是负资产
weights:
  fulfillment: 0.30         # 履约确定性：发货时效/同省/库存/起订量/拆包友好度
  content: 0.25             # 内容力：达人数/视频数/直播数（TikTok 是内容场，这是最大漏项）
  margin: 0.25              # 实净利：用 pricing.yaml 全成本（国内5 + 货代2 + 包材0.6 + 跨境按重量0.0198/g）算
  competition: 0.20         # 站内竞争：TikTok 在售款数/"无竞争对手"标签，不是 1688 同款数

# ── 需求过滤（不打分，通过/不通过）──
demand_filter:
  official_opportunity_tag: true      # 官方"未满足需求/热搜商品/无竞争对手"标签直接通过
  keyword_search_min: 3000            # 关键词月搜索量下限（官方后台口径）
  opportunity_sales_min: 1000         # 商品机会中心销量下限（7k+/8k+ 这类近似值）
  low_competition_category_ok: true   # 低竞争类目（在售0-5款 + 有搜索量）可豁免上述下限
  note: "三者满足其一即通过。榜单排名（遨虾 opprank）只作方向信号，不作达标依据"

# ── 供应链硬门槛（不满足=该品做不了，等同否决）──
supplier_gates:
  cross_border_supply: true           # 1688 跨境专供标识
  dropship_supported: true            # 支持一件代发
  min_order_qty: 1                    # 无隐形起订量（页面写"一件代发"实际"满3件才发"的要剔除）
  stock_min: 200                      # 库存≥200，否则一周内必断货
  no_presale: true                    # 非预售、非定制、非定做尺寸
  main_image_reusable: true           # 主图可直接复用（新人不具备重拍能力）
  # 图片闸门源头门槛（2026-11-12 新增，见 SKILL.md Step 4.3）：
  # 1688 详情长图常整版是「跨境电商专用/工厂直供/一件代发」B2B 招商素材，只能整图删不能擦。
  # 删完若连 3 张干净消费者向主图都不剩，这个货源就不该进采集箱——铺进去再发现，
  # 重认领会丢图片/类目/价格（Step 4.5），代价远大于换一家供应商。
  # ⚠️ 2026-11-12 第二批实测：本门槛**写了但没执行**，导致 5/10 品跑完全流程才发现 0 张干净主图。
  # 根因：选品用的遨虾 aibuy_rank_client.py search 返回 26 字段，**不含任何图片**。
  # → 取到 offerId 后必须先拉 1688 主图目视过闸，才能进 Step 1 采集。
  # 注意别和发布闸门 image_gate.yaml 的 min_clean_main_images:1 混用，这里要求 3 张。
  clean_consumer_images_min: 3        # 无中文/无B2B字样的消费者向主图 ≥3 张（按整图删后的余量估）
  desc_rebuildable: true              # 详情长图允许整图删后用当地语言文本+干净图重建；全脏且无可重建图 = 换货源
  # ⛔ 以下 3 行是 $5 下限时代的残留，仅定价模型备查，**不得据此铺货**（2026-11-12 第二批纠正）：
  # 一件代发认领后 SKU 是单件规格、代发只下 1 件，按 2 件成本定价 = 收 2 件钱发 1 件（履约事故）。
  # 且下限降到 $3.5 后单件 @250g/400g 已落带内，不需要组合装抬客单价。ERP 捆绑发货能力 UNKNOWN。
  # 选品时 `--pieces` 一律 1；见 SKILL 4.4 / strategy 3.3 / pitfalls 9.5。
  bundle_partner_min_skus: 2          # 同店/同款可组装的 SKU 数（仅备查）
  bundle_allow_same_offer: true       # 允许"同款买 2 件"自组 2 件套（仅备查，不执行）
  free_shipping_price_available: preferred  # 优先有"包邮价"SKU（1件起可用）
  # 2026-11-12 升级为**强门槛**：真包邮（供应商承担运费到货代仓，非"满3件才免邮"）
  # 到岸成本直降 5 元 → 同价位可承受采购价 +¥5，是零风险、不需要货代配合的唯一降本手段。
  # 备货方案（提前入仓摊薄运费）经用户确认"货代可能不接受"，故包邮成为首选替代路径。
  true_free_shipping: required
  free_shipping_proof: "商品页邮费显示 ¥0 且起批 1 件；或客服书面确认发浙江/广东地址包邮"

# ── 一票否决红线（命中即跳过，不进入打分）──
redlines:
  brand_ip: true            # 品牌侵权/动漫影视IP联名(标题+主图双查)
  liquid_chemical: true     # 液体/膏体/化工(物流与合规受限)
  battery_powered: true     # 带电/电池(新人避开，物流贵+限制多)
  food_health_medical: true # 食品/保健/医疗
  religious: true           # 宗教/民俗敏感
  fragile: true             # 易碎(玻璃陶瓷等，退货率高)
  live_goods: true          # 活物/种苗
  multi_spec_wide: true     # 多规格价差必超限(卷材/管材/按尺寸选)
  restricted_category: true # 平台限售需认证(母婴/美妆个护等)
  cross_category: true      # 家居类目外的品(跨类目发品会被下架甚至处罚)

# ── 站内竞争（口径已修正：1688 同款数不是竞争度）──
competition:
  source_primary: tiktok_onsite       # 主口径 = TikTok 站内在售款数/官方标签
  official_no_rival_score: 10         # 官方标"无竞争对手"= 满分
  onsite_listings_excellent: 5        # 站内在售 ≤5 款 = 9 分
  onsite_listings_good: 20            # 6-20 款 = 7 分
  onsite_listings_mid: 50             # 21-50 款 = 5 分
  onsite_listings_bad: 51             # >50 款 = 2 分（原值写 50，与 mid 撞了，边界不可判）
  # 1688 同款数只用作"跟卖时间窗"，与竞争度是两个不同指标
  same_offer_window_ideal_max: 10     # 聚簇 <10 = 源头新品窗口期，+1 分
  same_offer_crowded_min: 300         # >300 = 中国卖家已涌入，2-4 周内到价格战，-2 分
  proxy_mode_cap: 7                   # 无站内数据时（只能看1688同款数）最高给 7 分，不得给满分
  note: "旧配置 same_offer_max=3000 判红海是错的：同款多说明供给充沛，不代表站内竞争大"

# ── 内容力（TikTok 特有维度，权重 25%）──
content:
  # 2026-11-11 实测打通：ERP 后端直连 FastMoss，无需订阅/无需 LinkFox
  #   端点 /item/fastmoss/product/search（免 token），脚本 scripts/kdzs_fastmoss.py
  source_primary: fastmoss_via_erp   # 字段 creatorCount / videoCount / creatorOrderRate
  creators_excellent: 100             # ≥100 达人带过 = 10 分（内容结构已被验证可复制）
  creators_good: 30                   # 30-99 = 8 分
  creators_mid: 10                    # 10-29 = 6 分
  creators_low: 3                     # <10 = 3 分
  # 达人出单率（creatorOrderRate）——不开达人佣金时的生死线，见 strategy §4.7
  creator_order_rate:
    shelf_friendly_max: 0.30          # ≤30%：货架场/自然搜索为主，与达人不冲突 → 可做
    shelf_only_ideal: 0.05            # ≤5%：几乎全靠自然搜索 → 最该抢（首单压缩袋实测 0%）
    creator_driven_min: 0.80          # ≥80%：纯达人驱动，不开佣金拿不到量 → 剔除或降级
  # 数据通道不可用（接口故障/字段缺失）时的降级口径
  proxy_mode: visual_demo             # 按"可拍性"判：前后对比可见/单件可手持演示/痛点动作明确/无长解释文字
  proxy_hits_for_6: 3                 # 满足≥3项给 6 分
  proxy_mode_cap: 6                   # 降级口径最高 6 分，禁止给满分（避免虚假精确度）

# ── 利润（全成本口径，见 pricing.yaml）──
margin:
  min_net_margin: 0.08                # 净利率低于 8% 剔除（含退款预留后的真实净利）
  full_score_net_margin: 0.25         # ≥25% 满分
  good_net_margin: 0.18               # 18-25% = 8 分
  mid_net_margin: 0.12                # 12-18% = 6 分
  low_net_margin: 0.08                # 8-12% = 4 分
  scheme_default: shelf               # 当前只走货架场（不开达人佣金，pricing.yaml 里 creator 档 enabled:false）
  scheme_alt: creator                 # 备查档；启用前必须先把净利目标降到 0.15，否则该组合无解
  note: "旧配置 min_sell_cost_ratio 3.0/3.5 是基于'国内运费1元'的错误前提推导，已废弃"

# ── 单量分层（决定履约模式，不是选品指标）──
volume_tiers:
  # ⚠ 2026-11-12：原规则"<10单/日纯代发、>30单/日才备货"方向反了 —— 破零期才最需要摊薄运费，
  #   起量后反而可以靠单量谈运费。真正的前置条件是**货代是否接受提前入仓**。
  #   经用户确认：所用货代"可能不接受提前入仓备货" → 当前按 dropship_only 运行，
  #   备货降本由"真包邮货源"替代（见 supplier_gates.true_free_shipping）。
  stock_up_supported: false           # 货代是否支持提前入仓备货（人工确认后改 true）
  dropship_pure_max: 10               # <10单/日：纯代发，接受 5 元运费
  negotiate_range: 30                 # 10-30单/日：谈包邮价SKU/固定运费3元，主推 2 件套
  stock_up_min: 30                    # >30单/日：转小批量备货到货代仓（需 stock_up_supported=true）

# ── 铺货节奏 ──
cadence:
  first_batch: 150          # 第一批铺货目标(官方出单门槛)
  second_batch: 50          # 第二批补充(第一批有数据后)
  # ⚠ 2026-11-12：官方"150 款 / 20 天出首单"是统计规律，不是承诺。
  #   以每天 3 小时可投入计：150 款必须走"长尾快车道"，否则按现流程（单款 30–60 分钟）要 2 年。
  daily_hours_available: 3
  per_item_budget_min_hero: 45      # hero 款（10–20 个）单款预算
  per_item_budget_min_longtail: 3   # 长尾款单款预算（只发干净主图 + 模板化描述）
  # ── T+0 发布后 48h 入池检查（新增，破零最关键的窗口，旧版完全没有）──
  # 上架后静置 48h 不要改标题/主图（会触发重收录）；之后看
  # 后台「数据 → 商城与搜索 → 推荐板块」
  listing_index_check_hours: 48
  exposure_not_indexed_threshold: 100   # 曝光 <100 判为"未入池" → 换主图强制重收录
  opportunity_apply_every_days: 3       # 商品机会「热门搜索/精选搜索」提报关联，每 3 天回看一次
  optimize_day: 7           # 第7天看曝光/点击数据
  kill_day: 20              # 20天无出单/无流量即下架换品
  data_backflow_day: [2, 7, 20]  # T+2 入池、T+7 曝光点击、T+20 成交判定
