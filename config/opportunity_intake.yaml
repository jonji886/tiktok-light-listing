# 2026-11-19 收紧：删掉 cleaner/cleanser/fragrance/pewangi——
#   "cleaning brush/tank cleaner cube" 是工具与固体片，"scented/fragrance garbage bag" 是带香固体袋，
#   都不是液体品；液体语境已由 liquid/gel/spray/pencuci 等具体词根覆盖，宽词只会误杀。
liquid_exclusions:
  - washing machine
  - washing cloth
  - washing towel
  - cleaner cube
  - cleaning tablet
  - laundry bag
  - washing brush
  - pencuci mesin
  - toilet cleaner tanpa berus
  - silica gel

# ── 需求过滤（与 selection.yaml demand_filter 对齐）──
demand_filter:
  opportunity_sales_min: 1000     # 卡片销量近似值下限（"3.2k+" → 3200）
