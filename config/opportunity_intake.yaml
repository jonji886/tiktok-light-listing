# ── 价格带校验 ──
# 参考价区间（本币）换算 USD 后与 pricing.yaml 的 price_band_usd 比对：
#   区间上限 < 带下限 → price_below_band reject（挂价压不进带内 = 无利可图）
#   区间下限 > 带上限 → price_above_band reject（超出主流客单，转化存疑）
#   其余 → 带内可继续，但**机会价只是市场参考**，最终定价仍走 pricing_calc
price_check:
  enabled: true
  # 本币符号 → 站点（机会页参考价前缀）
  currency_prefix:
    "RM": MY
    "฿": TH
    "THB": TH
    "₫": VN
    "VND": VN

