# 品牌启发式：标题首词或独立大写词（≥4 字母、非全大写通用词、不在通用词白名单）
# 命中 → 标 brand_suspect 转 direction_only + 人工复核，不直接 reject（降误杀）。
brand_heuristic:
  min_len: 4
  # 全大写也不算品牌的通用营销词
  generic_upper: [ID, SET, PCS, PC, CM, MM, ML, KG, G, NEW, HOT, COD, SSM, DIY, LED, UV, ABS, PVC, PP, PE, TPU, XXL, XL, XS, MY, SG, TH, VN, PH, 1S, 2S, 3S, 5S, 10S,
    CHEAPEST, FOOD, DESICCANT, SILICA, OXYGEN, ABSORBER, PENYERAP, STRONG, STICKY, PREMIUM, CARTON, QUALITY, MULTI, SURFACE, SERIES, BLACK, WHITE, HOTEL, STAR, PURE, GIFT, DELUXE, DISPOSABLE, FLUORESCENT, FREE, SHEETS, PUMP, BIG, LIMITED, EDITION, ORIGINAL, AUTHENTIC, READY, STOCK, SALE, PROMO, BEST, TOP, SLOW, RISING, ANTI, BACTERIAL, ANTIBACTERIAL, KILLER, REPELLENT, REPEL, INSECT, MOSQUITO, MOLD, MILDEW, RUST, ODOR, STAIN, STAINS, GREASE, OIL, WATERPROOF, NONSLIP, NONSLIP]

