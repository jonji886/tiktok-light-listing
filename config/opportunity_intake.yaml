# 商品机会中心（/product/opportunity）信号判读配置
# 版本：2026-11-19（MY 主攻站改造时新增；配套 scripts/opportunity_intake.py）
#
# 数据口径警示（2026-11-19 浏览器实测 + 官方 Seller University 文档，写在最前面）：
#   1. 「基于市场趋势的热门商品」= 外部平台（URL sub_tabs=shp_top_products，指向 Shopee 类榜单，
#      INFERRED）热销但 TikTok 供给不足的品。卡片上的「3.2k+ 销量」是**外部平台销量**，
#      不是 TikTok 站内已验证需求 → 只能当方向信号，不能当铺货清单。
#   2. 「无竞争对手」有两种成因：真缺口 / 该品在 TikTok 根本卖不动（低客单消耗品、
#      内容形态不适配）。机会详情页趋势图若为**平直线**（实测 Winstar 垃圾袋 30 天
#      成交件数纹丝不动 3.2K），大概率是外部快照而非平台内动态，需求真伪必须回
#      FastMoss 站内数据复核。
#   3. 机会详情里 市场GMV/库存可用性/可用商品数/商家总数 显示 "--"（实测纸尿裤袋）
#      = 平台无 TikTok 侧数据 → 该信号自动降级 direction_only，禁止直接铺。
#   4. 品牌品（WATSONS/Winstar 等）出现在机会列表 = 平台请你跟卖品牌货，
#      撞 selection.yaml redlines.brand_ip，一律 reject 不商量。

# ── 品牌红线词表（标题命中即 reject；小写比对）──
# 只收录"确认是品牌"的词。判不准的走 manual_review 而不是自动 reject。
